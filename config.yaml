# English AI Videos Configuration
# ================================

# Video Generation Settings
video:
  # Background mode: "random" picks from enabled list, "fixed" uses default_background
  background_mode: "random"

  # Used when background_mode is "fixed"
  default_background: "static_midnight"

  # Backgrounds available for random selection.
  #
  # Gradients, not photographs. Every entry here clears 4.5:1 contrast
  # against the yellow headline in the band the headline occupies, measured
  # on the bare background before the 6px outline is drawn, and measured
  # across the whole colour cycle for the animated ones rather than at a
  # single instant. The floor of this set is 4.65:1 (static_purple).
  #
  # Re-measure after any edit here:
  #   python3 tools/background_contact_sheet.py --enabled
  #
  # The 11 photo_* presets remain defined in src/backgrounds.py and are
  # deliberately absent: six of them measured between 2.08:1 and 3.69:1,
  # because a sunset or a cloudscape puts its brightest region exactly
  # where the headline goes. The energetic and particle families are absent
  # for the opposite reason — they render very nearly black.
  #
  # Dropped from this list for failing the gate, worst-case:
  #   static_rosegold 3.14:1   static_candy 3.63:1   static_cotton 4.25:1
  enabled_backgrounds:
    # static_gradient — rendered once, identical every frame
    - static_sunset
    - static_ocean
    - static_purple
    - static_neon
    - static_emerald
    - static_midnight
    - static_fire
    - static_galaxy
    - static_teal
    # animated_gradient — slow colour cycle
    - purple_vibes
    - blue_calm
    - warm_sunset
    - deep_space
    - ocean_depth
    - midnight_blue
    - sunset_glow
    # Every palette in assets/palettes.json — sampled from a seed and put
    # through three gates: 4.5:1 worst-case contrast, a CIELAB distance of 12
    # from every other palette, and hue discipline (no complementary blends,
    # nothing in the olive band, a chroma floor read off static_teal).
    # Regenerate with `python3 -m palettes`; this line needs no edit when the
    # count changes, which is the point of it not being a list of names.
    - generated:*

  # Video dimensions (TikTok vertical format)
  width: 1080
  height: 1920
  fps: 30

  # Animation style: clean_pop, energetic, karaoke
  animation_style: "clean_pop"

# Audio/TTS Settings
audio:
  # Provider: elevenlabs (primary), openai (fallback)
  provider: "elevenlabs"

  # Voice settings for ElevenLabs
  voice_id: "default"
  model: "eleven_v3"

  # Bilingual segment-based narration (tts_bilingual.py)
  # Base narration language and the accent for marked English terms.
  narration_lang: "es"          # native Latin-American Spanish narration
  english_accent: "en-US"       # accent for English teaching words
  # Model for per-segment synthesis — MUST support language_code
  # (eleven_turbo_v2_5 or eleven_flash_v2_5; eleven_v3 does NOT).
  segment_model: "eleven_turbo_v2_5"
  english_speed_factor: 0.92    # short EN terms read slightly slower

  # Humanization settings
  global_speed: 1.0           # Natural speed — v3 handles pacing on its own
  stability: 0.50             # Balanced: human but no hallucinated artifacts
  similarity_boost: 0.80      # High fidelity to voice character
  style: 0.05                 # Minimal — prevents filler-sound artifacts
  speaker_boost: true         # Enhanced clarity for teaching
  humanize: true              # Add natural pauses and breathing

# Output Directories
output:
  videos: "output/video"
  audio: "output/audio"
  frames: "output/frames"

# Character Mascot (animated lip-sync)
character:
  enabled: false
  name: "fox"                 # Character folder under assets/characters/
  position_x: 50              # Bottom-left (avoids TikTok right-side buttons)
  position_y: 1450
  size: 350                   # Character size in pixels (larger for better visibility)
  opacity: 0.95

# Upload Settings
upload:
  # Platforms to upload to (requires API keys in .env)
  platforms:
    - tiktok
    - youtube
    # - instagram  # Requires public video URL hosting (S3/CloudFlare)

  # Default hashtags per video type
  hashtags:
    educational: "#LearnEnglish #English #EnglishTips #AprendeInglés #Idiomas"
    quiz: "#EnglishQuiz #QuizTime #LearnEnglish #AprendeInglés"
    true_false: "#TrueOrFalse #EnglishQuiz #LearnEnglish #Idiomas"
    fill_blank: "#FillInTheBlank #EnglishPractice #LearnEnglish"
    pronunciation: "#Pronunciation #EnglishTips #SpeakEnglish"
    vocabulary: "#Vocabulary #EnglishWords #LearnEnglish"

# Content Generation
content:
  # Default video type: educational, quiz, true_false, fill_blank, pronunciation
  default_type: "educational"

# Active profile: adults | kids
profile: "adults"

profiles:
  adults:
    # hereda todo del config base (comportamiento actual)
  kids:
    audio:
      # KNOWN ISSUE: this placeholder is NOT validated anywhere. Confirmed by
      # dry-run with profile: kids — it resolves straight through to
      # voice_id=KIDS_VOICE_ID_PENDIENTE and would be sent to the ElevenLabs
      # API verbatim, failing at call time rather than at config load.
      # Replace with a real voice id before using the kids profile.
      voice_id: "KIDS_VOICE_ID_PENDIENTE"   # se reemplaza al elegir voz
      model: "eleven_v3"
      stability: 0.55
      style: 0.30
      global_speed: 0.95
    video:
      background_mode: "clips"
      clips_dir: "assets/clips/kids"
      animation_style: "clean_pop"
    content:
      categories: ["kids_colors", "kids_numbers", "kids_animals"]
